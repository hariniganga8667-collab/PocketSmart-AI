<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Party Planner | PocketSmart AI</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <main class="hero">

        <div class="hero-content">

            <p class="tagline">
                POCKETSMART AI
            </p>

            <h1>
                🎉 Party Planner
            </h1>

            <p class="description">
                Tell us your budget, guests and party requirements.
                PocketSmart AI will help you plan it smartly.
            </p>


            <form class="planner-form" action="/generate-party" method="post">

                <label for="budget">
                    Your Budget (₹)
                </label>

                <input
                    type="number"
                    id="budget"
                    name="budget"
                    placeholder="Example: 30000"
                    min="1"
                    required
                >


                <label for="guests">
                    Number of Guests
                </label>

                <input
                    type="number"
                    id="guests"
                    name="guests"
                    placeholder="Example: 50"
                    min="1"
                    required
                >


                <label for="event">
                    Event Type
                </label>

                <select
                    id="event"
                    name="event"
                    required
                >
                    <option value="">
                        Select an event
                    </option>

                    <option value="Birthday Party">
                        Birthday Party
                    </option>

                    <option value="Wedding">
                        Wedding
                    </option>

                    <option value="Engagement">
                        Engagement
                    </option>

                    <option value="Baby Shower">
                        Baby Shower
                    </option>

                    <option value="College Event">
                        College Event
                    </option>

                    <option value="Family Function">
                        Family Function
                    </option>
                </select>


                <label for="venue">
                    Venue
                </label>

                <select
                    id="venue"
                    name="venue"
                    required
                >
                    <option value="">
                        Select a venue
                    </option>

                    <option value="Home">
                        Home
                    </option>

                    <option value="Hall">
                        Function Hall
                    </option>

                    <option value="Outdoor">
                        Outdoor
                    </option>

                    <option value="Restaurant">
                        Restaurant
                    </option>
                </select>


                <label for="requirements">
                    What do you need?
                </label>

                <textarea
                    id="requirements"
                    name="requirements"
                    rows="5"
                    placeholder="Example: Food, decoration, cake, photography, music..."
                    required
                ></textarea>


                <button type="submit">
                    Generate Party Plan
                </button>

            </form>

        </div>

    </main>

</body>
</html>
