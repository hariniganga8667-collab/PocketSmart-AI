<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jewelry Planner | PocketSmart AI</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <main class="hero">

        <div class="hero-content">

            <p class="tagline">
                POCKETSMART AI
            </p>

            <h1>
                💎 Jewelry Planner
            </h1>

            <p class="description">
                Tell us your budget, occasion and preferred style.
                PocketSmart AI will help you choose jewelry smartly.
            </p>

            <form class="planner-form" action="/generate-jewelry" method="post">

                <label for="budget">
                    Your Budget (₹)
                </label>

                <input
                    type="number"
                    id="budget"
                    name="budget"
                    placeholder="Example: 25000"
                    min="1"
                    required
                >

                <label for="occasion">
                    Occasion
                </label>

                <select id="occasion" name="occasion" required>
                    <option value="">Select an occasion</option>
                    <option value="Wedding">Wedding</option>
                    <option value="Engagement">Engagement</option>
                    <option value="Festival">Festival</option>
                    <option value="Birthday">Birthday</option>
                    <option value="Party">Party</option>
                    <option value="Daily Wear">Daily Wear</option>
                </select>

                <label for="style">
                    Preferred Style
                </label>

                <select id="style" name="style" required>
                    <option value="">Select a style</option>
                    <option value="Traditional">Traditional</option>
                    <option value="Modern">Modern</option>
                    <option value="Minimalist">Minimalist</option>
                    <option value="Elegant">Elegant</option>
                    <option value="Statement">Statement</option>
                </select>

                <label for="requirements">
                    What are you looking for?
                </label>

                <textarea
                    id="requirements"
                    name="requirements"
                    rows="5"
                    placeholder="Example: Necklace, earrings and bangles..."
                    required
                ></textarea>

                <button type="submit">
                    Generate Jewelry Plan
                </button>

            </form>

        </div>

    </main>

</body>
</html>
